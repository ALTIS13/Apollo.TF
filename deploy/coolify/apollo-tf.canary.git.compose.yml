# Git-backed Coolify Application entrypoint. Keep in sync with the base plus
# canary override using docker compose config --no-interpolate --no-path-resolution.
# The release canary binding validator rejects a rendered mismatch.
name: apollo-tf-canary
networks:
  tf-data:
    internal: true
    name: apollo-tf-canary-data-v1
  tf-download-control:
    internal: true
    name: apollo-tf-canary-download-control-v1
  tf-download-egress:
    name: apollo-tf-canary-download-egress-v1
  tf-download-queue:
    internal: true
    name: apollo-tf-canary-download-queue-v1
  tf-edge:
    name: apollo-tf-canary-edge-v1
  tf-integrations-control:
    internal: true
    name: apollo-tf-canary-integrations-control-v1
  tf-integrations-data:
    internal: true
    name: apollo-tf-canary-integrations-data-v1
  tf-integrations-egress:
    name: apollo-tf-canary-integrations-egress-v1
  tf-search-control:
    internal: true
    name: apollo-tf-canary-search-control-v1
  tf-search-egress:
    name: apollo-tf-canary-search-egress-v1
secrets:
  admin_access_htpasswd:
    file: ${TF_CANARY_ADMIN_CREDENTIAL_DIRECTORY:?}/admin_access_htpasswd
    name: apollo-tf-canary_admin_access_htpasswd
  admin_dashboard_token:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/admin_dashboard_token
    name: apollo-tf-canary_admin_dashboard_token
  tf_admin_database_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_admin_database_url
    name: apollo-tf-canary_tf_admin_database_url
  tf_auth_redis_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_auth_redis_url
    name: apollo-tf-canary_tf_auth_redis_url
  tf_cache_redis_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_cache_redis_url
    name: apollo-tf-canary_tf_cache_redis_url
  tf_client_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_client_secret
    name: apollo-tf-canary_tf_client_secret
  tf_download_heartbeat_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_download_heartbeat_secret
    name: apollo-tf-canary_tf_download_heartbeat_secret
  tf_download_internal_auth_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_download_internal_auth_secret
    name: apollo-tf-canary_tf_download_internal_auth_secret
  tf_download_queue_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_download_queue_password
    name: apollo-tf-canary_tf_download_queue_password
  tf_download_queue_redis_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_download_queue_redis_url
    name: apollo-tf-canary_tf_download_queue_redis_url
  tf_integrations_heartbeat_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_heartbeat_secret
    name: apollo-tf-canary_tf_integrations_heartbeat_secret
  tf_integrations_internal_auth_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_internal_auth_secret
    name: apollo-tf-canary_tf_integrations_internal_auth_secret
  tf_integrations_migrator_database_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_migrator_database_url
    name: apollo-tf-canary_tf_integrations_migrator_database_url
  tf_integrations_migrator_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_migrator_password
    name: apollo-tf-canary_tf_integrations_migrator_password
  tf_integrations_postgres_admin_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_postgres_admin_password
    name: apollo-tf-canary_tf_integrations_postgres_admin_password
  tf_integrations_runtime_database_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_runtime_database_url
    name: apollo-tf-canary_tf_integrations_runtime_database_url
  tf_integrations_runtime_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_runtime_password
    name: apollo-tf-canary_tf_integrations_runtime_password
  tf_integrations_spotify_client_id:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_spotify_client_id
    name: apollo-tf-canary_tf_integrations_spotify_client_id
  tf_integrations_spotify_client_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_spotify_client_secret
    name: apollo-tf-canary_tf_integrations_spotify_client_secret
  tf_integrations_token_keyring:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_integrations_token_keyring
    name: apollo-tf-canary_tf_integrations_token_keyring
  tf_migrator_database_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_migrator_database_url
    name: apollo-tf-canary_tf_migrator_database_url
  tf_migrator_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_migrator_password
    name: apollo-tf-canary_tf_migrator_password
  tf_module_heartbeat_keys:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_module_heartbeat_keys
    name: apollo-tf-canary_tf_module_heartbeat_keys
  tf_postgres_admin_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_postgres_admin_password
    name: apollo-tf-canary_tf_postgres_admin_password
  tf_redis_acl:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_redis_acl
    name: apollo-tf-canary_tf_redis_acl
  tf_redis_health_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_redis_health_password
    name: apollo-tf-canary_tf_redis_health_password
  tf_runtime_database_url:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_runtime_database_url
    name: apollo-tf-canary_tf_runtime_database_url
  tf_runtime_password:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_runtime_password
    name: apollo-tf-canary_tf_runtime_password
  tf_search_heartbeat_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_search_heartbeat_secret
    name: apollo-tf-canary_tf_search_heartbeat_secret
  tf_search_internal_auth_secret:
    file: ${TF_CANARY_SECRET_DIRECTORY:?}/tf_search_internal_auth_secret
    name: apollo-tf-canary_tf_search_internal_auth_secret
services:
  tf-admin:
    depends_on:
      tf-api:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      ADMIN_ACCESS_HTPASSWD_FILE: /run/secrets/admin_access_htpasswd
      ADMIN_DASHBOARD_TOKEN_FILE: /run/secrets/admin_dashboard_token
      APOLLO_API_UPSTREAM: http://tf-api:8080
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 5s
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/healthz
      timeout: 3s
    image: ${TF_ADMIN_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-edge: null
    pids_limit: 128
    ports:
      - 127.0.0.1:${TF_CANARY_ADMIN_PORT:?}:80
    restart: unless-stopped
    secrets:
      - gid: "10001"
        mode: "0400"
        source: admin_dashboard_token
        target: admin_dashboard_token
        uid: "10001"
      - gid: "0"
        mode: "0400"
        source: admin_access_htpasswd
        target: admin_access_htpasswd
        uid: "0"
    stop_grace_period: 20s
  tf-api:
    cap_drop:
      - ALL
    depends_on:
      tf-download-redis:
        condition: service_healthy
        required: true
      tf-download-worker:
        condition: service_healthy
        required: true
      tf-integrations:
        condition: service_healthy
        required: true
      tf-migrate:
        condition: service_completed_successfully
        required: true
      tf-postgres:
        condition: service_healthy
        required: true
      tf-redis:
        condition: service_healthy
        required: true
      tf-search:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      - ADMIN_DASHBOARD_TOKEN_FILE=/run/secrets/admin_dashboard_token
      - APOLLO_API_VERSION=${TF_API_VERSION:?}
      - APOLLO_DEPLOYED_AT=${TF_DEPLOYED_AT:?}
      - APOLLO_MODULE_HEARTBEAT_KEYS_FILE=/run/secrets/tf_module_heartbeat_keys
      - APOLLO_PLATFORM_API_ORIGIN=${PLATFORM_CANARY_PUBLIC_ORIGIN:?}
      - APOLLO_PLATFORM_ISSUER=${PLATFORM_CANARY_PUBLIC_ORIGIN:?}
      - APOLLO_TF_AUTH_REDIS_URL_FILE=/run/secrets/tf_auth_redis_url
      - APOLLO_TF_BRIDGE_ALLOW_INTERNAL_HTTP=false
      - APOLLO_TF_CALLBACK_URL=${TF_CANARY_API_PUBLIC_ORIGIN:?}/api/auth/callback
      - APOLLO_TF_CLIENT_ID=apollo-tf-api
      - APOLLO_TF_CLIENT_SECRET_FILE=/run/secrets/tf_client_secret
      - APOLLO_TF_RENEWAL_ENABLED=false
      - APOLLO_TF_WEB_ORIGIN=${TF_CANARY_PUBLIC_ORIGIN:?}
      - DATABASE_URL_FILE=/run/secrets/tf_runtime_database_url
      - NODE_ENV=production
      - PORT=8080
      - REDIS_URL_FILE=/run/secrets/tf_cache_redis_url
      - SERVER_URL=${TF_CANARY_API_PUBLIC_ORIGIN:?}
      - TF_DOWNLOAD_QUEUE_ALLOW_INSECURE_REDIS=true
      - TF_DOWNLOAD_QUEUE_REDIS_URL_FILE=/run/secrets/tf_download_queue_redis_url
      - TF_DOWNLOAD_WORKER_ALLOW_INSECURE_HTTP=true
      - TF_DOWNLOAD_WORKER_INTERNAL_AUTH_SECRET_FILE=/run/secrets/tf_download_internal_auth_secret
      - TF_DOWNLOAD_WORKER_ORIGIN=http://tf-download-worker:8080
      - TF_INTEGRATIONS_ALLOW_INSECURE_HTTP=true
      - TF_INTEGRATIONS_INTERNAL_AUTH_SECRET_FILE=/run/secrets/tf_integrations_internal_auth_secret
      - TF_INTEGRATIONS_ORIGIN=http://tf-integrations:8080
      - TF_SEARCH_ALLOW_INSECURE_HTTP=true
      - TF_SEARCH_INTERNAL_AUTH_SECRET_FILE=/run/secrets/tf_search_internal_auth_secret
      - TF_SEARCH_ORIGIN=http://tf-search:8080
      - WEB_URL=${TF_CANARY_PUBLIC_ORIGIN:?}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 8s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/readyz').then(r=>{if(!r.ok)process.exit(1)})
      timeout: 3s
    image: ${TF_API_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
      tf-download-control: null
      tf-download-queue: null
      tf-edge: null
      tf-integrations-control: null
      tf-search-control: null
    pids_limit: 128
    ports:
      - 127.0.0.1:${TF_CANARY_API_PORT:?}:8080
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "10001"
        mode: "0400"
        source: admin_dashboard_token
        target: admin_dashboard_token
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_client_secret
        target: tf_client_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_auth_redis_url
        target: tf_auth_redis_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_cache_redis_url
        target: tf_cache_redis_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_runtime_database_url
        target: tf_runtime_database_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_internal_auth_secret
        target: tf_integrations_internal_auth_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_download_queue_redis_url
        target: tf_download_queue_redis_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_download_internal_auth_secret
        target: tf_download_internal_auth_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_module_heartbeat_keys
        target: tf_module_heartbeat_keys
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_search_internal_auth_secret
        target: tf_search_internal_auth_secret
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: 10001:10001
  tf-baseline:
    cap_drop:
      - ALL
    depends_on:
      tf-role-bootstrap:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
    entrypoint:
      - node
      - artifacts/api-server/dist/migrate.mjs
      - --baseline-existing-startup-schema
    environment:
      TF_BASELINE_DATABASE_URL_FILE: /run/secrets/tf_admin_database_url
    group_add:
      - "10002"
    image: ${TF_API_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
    pids_limit: 64
    profiles:
      - baseline
    read_only: true
    restart: 'no'
    secrets:
      - gid: "10002"
        mode: "0440"
        source: tf_admin_database_url
        target: tf_admin_database_url
        uid: "0"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 10001:10001
  tf-download-redis:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      TF_DOWNLOAD_QUEUE_PASSWORD_FILE: /run/secrets/tf_download_queue_password
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD
        - /usr/local/bin/queue-redis-health.sh
      timeout: 3s
    image: ${TF_DOWNLOAD_REDIS_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-download-queue: null
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "999"
        mode: "0400"
        source: tf_download_queue_password
        target: tf_download_queue_password
        uid: "999"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 999:999
    volumes:
      - source: tf-download-redis-data
        target: /data
        type: volume
        volume: {}
  tf-download-worker:
    cap_drop:
      - ALL
    depends_on:
      tf-download-redis:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
    environment:
      APOLLO_API_VERSION: ${TF_DOWNLOAD_VERSION:?}
      APOLLO_DEPLOYED_AT: ${TF_DOWNLOAD_DEPLOYED_AT:?}
      NODE_ENV: production
      PORT: "8080"
      TF_DOWNLOAD_HEARTBEAT_ALLOW_INSECURE_HTTP: "true"
      TF_DOWNLOAD_HEARTBEAT_API_ORIGIN: http://tf-api:8080
      TF_DOWNLOAD_HEARTBEAT_SECRET_FILE: /run/secrets/tf_download_heartbeat_secret
      TF_DOWNLOAD_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_download_internal_auth_secret
      TF_DOWNLOAD_QUEUE_ALLOW_INSECURE_REDIS: "true"
      TF_DOWNLOAD_QUEUE_REDIS_URL_FILE: /run/secrets/tf_download_queue_redis_url
      TF_DOWNLOAD_STORAGE_ROOT: /var/lib/apollo-tf/downloads
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      timeout: 3s
    image: ${TF_DOWNLOAD_WORKER_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-download-control:
        gw_priority: 0
      tf-download-egress:
        gw_priority: 1
      tf-download-queue:
        gw_priority: 0
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "10001"
        mode: "0400"
        source: tf_download_queue_redis_url
        target: tf_download_queue_redis_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_download_internal_auth_secret
        target: tf_download_internal_auth_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_download_heartbeat_secret
        target: tf_download_heartbeat_secret
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: 10001:10001
    volumes:
      - source: tf-downloads
        target: /var/lib/apollo-tf/downloads
        type: volume
        volume: {}
  tf-integrations:
    cap_drop:
      - ALL
    depends_on:
      tf-integrations-migrate:
        condition: service_completed_successfully
        required: true
      tf-integrations-postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      - APOLLO_API_VERSION=${TF_INTEGRATIONS_VERSION:?}
      - APOLLO_DEPLOYED_AT=${TF_INTEGRATIONS_DEPLOYED_AT:?}
      - NODE_ENV=production
      - PORT=8080
      - TF_INTEGRATIONS_DATABASE_URL_FILE=/run/secrets/tf_integrations_runtime_database_url
      - TF_INTEGRATIONS_HEARTBEAT_ALLOW_INSECURE_HTTP=true
      - TF_INTEGRATIONS_HEARTBEAT_API_ORIGIN=http://tf-api:8080
      - TF_INTEGRATIONS_HEARTBEAT_SECRET_FILE=/run/secrets/tf_integrations_heartbeat_secret
      - TF_INTEGRATIONS_INTERNAL_AUTH_SECRET_FILE=/run/secrets/tf_integrations_internal_auth_secret
      - TF_INTEGRATIONS_SPOTIFY_CALLBACK_URI=${TF_CANARY_API_PUBLIC_ORIGIN:?}/api/spotify/callback
      - TF_INTEGRATIONS_SPOTIFY_CLIENT_ID_FILE=/run/secrets/tf_integrations_spotify_client_id
      - TF_INTEGRATIONS_SPOTIFY_CLIENT_SECRET_FILE=/run/secrets/tf_integrations_spotify_client_secret
      - TF_INTEGRATIONS_TOKEN_KEYRING_FILE=/run/secrets/tf_integrations_token_keyring
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      timeout: 3s
    image: ${TF_INTEGRATIONS_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-integrations-control:
        gw_priority: 0
      tf-integrations-data:
        gw_priority: 0
      tf-integrations-egress:
        gw_priority: 1
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_runtime_database_url
        target: tf_integrations_runtime_database_url
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_token_keyring
        target: tf_integrations_token_keyring
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_spotify_client_id
        target: tf_integrations_spotify_client_id
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_spotify_client_secret
        target: tf_integrations_spotify_client_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_internal_auth_secret
        target: tf_integrations_internal_auth_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_heartbeat_secret
        target: tf_integrations_heartbeat_secret
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 10001:10001
  tf-integrations-migrate:
    cap_drop:
      - ALL
    command:
      - node
      - /app/dist/migrate.mjs
    depends_on:
      tf-integrations-postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
    environment:
      TF_INTEGRATIONS_DATABASE_URL_FILE: /run/secrets/tf_integrations_migrator_database_url
    image: ${TF_INTEGRATIONS_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-integrations-data: null
    pids_limit: 64
    read_only: true
    restart: 'no'
    secrets:
      - gid: "10001"
        mode: "0400"
        source: tf_integrations_migrator_database_url
        target: tf_integrations_migrator_database_url
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 10001:10001
  tf-integrations-postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      POSTGRES_DB: apollo_tf_integrations
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_integrations_postgres_admin_password
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d apollo_tf_integrations
      timeout: 5s
    image: ${TF_INTEGRATIONS_POSTGRES_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-integrations-data: null
    pids_limit: 128
    restart: unless-stopped
    secrets:
      - gid: "999"
        mode: "0400"
        source: tf_integrations_postgres_admin_password
        target: tf_integrations_postgres_admin_password
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_integrations_migrator_password
        target: tf_integrations_migrator_password
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_integrations_runtime_password
        target: tf_integrations_runtime_password
        uid: "999"
    stop_grace_period: 20s
    volumes:
      - source: tf-integrations-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  tf-migrate:
    cap_drop:
      - ALL
    depends_on:
      tf-postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
    entrypoint:
      - node
      - artifacts/api-server/dist/migrate.mjs
    environment:
      TF_MIGRATOR_DATABASE_URL_FILE: /run/secrets/tf_migrator_database_url
    image: ${TF_API_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
    pids_limit: 64
    read_only: true
    restart: 'no'
    secrets:
      - gid: "10001"
        mode: "0400"
        source: tf_migrator_database_url
        target: tf_migrator_database_url
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 10001:10001
  tf-postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      POSTGRES_DB: apollo_trackfinder
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_postgres_admin_password
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d apollo_trackfinder
      timeout: 5s
    image: ${TF_POSTGRES_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
    pids_limit: 128
    restart: unless-stopped
    secrets:
      - gid: "999"
        mode: "0400"
        source: tf_postgres_admin_password
        target: tf_postgres_admin_password
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_migrator_password
        target: tf_migrator_password
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_runtime_password
        target: tf_runtime_password
        uid: "999"
    stop_grace_period: 20s
    volumes:
      - source: tf-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  tf-redis:
    cap_drop:
      - ALL
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --aclfile
      - /run/secrets/tf_redis_acl
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 3s
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/tf_redis_health_password)" redis-cli
          --user tf-health ping | grep -qx PONG
      timeout: 3s
    image: ${TF_REDIS_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "999"
        mode: "0400"
        source: tf_redis_acl
        target: tf_redis_acl
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_redis_health_password
        target: tf_redis_health_password
        uid: "999"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 999:999
    volumes:
      - source: tf-redis-data
        target: /data
        type: volume
        volume: {}
  tf-role-bootstrap:
    cap_drop:
      - ALL
    depends_on:
      tf-postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
    entrypoint:
      - /usr/local/bin/bootstrap-tf-roles.sh
    environment:
      TF_ROLE_BOOTSTRAP_DATABASE_URL_FILE: /run/secrets/tf_admin_database_url
    group_add:
      - "10002"
    image: ${TF_POSTGRES_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-data: null
    pids_limit: 64
    profiles:
      - baseline
    read_only: true
    restart: 'no'
    secrets:
      - gid: "10002"
        mode: "0440"
        source: tf_admin_database_url
        target: tf_admin_database_url
        uid: "0"
      - gid: "999"
        mode: "0400"
        source: tf_migrator_password
        target: tf_migrator_password
        uid: "999"
      - gid: "999"
        mode: "0400"
        source: tf_runtime_password
        target: tf_runtime_password
        uid: "999"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: 999:999
  tf-search:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    environment:
      APOLLO_API_VERSION: ${TF_SEARCH_VERSION:?}
      APOLLO_DEPLOYED_AT: ${TF_SEARCH_DEPLOYED_AT:?}
      NODE_ENV: production
      PORT: "8080"
      TF_SEARCH_HEARTBEAT_ALLOW_INSECURE_HTTP: "true"
      TF_SEARCH_HEARTBEAT_API_ORIGIN: http://tf-api:8080
      TF_SEARCH_HEARTBEAT_SECRET_FILE: /run/secrets/tf_search_heartbeat_secret
      TF_SEARCH_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_search_internal_auth_secret
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 5s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      timeout: 3s
    image: ${TF_SEARCH_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-search-control:
        gw_priority: 0
      tf-search-egress:
        gw_priority: 1
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    secrets:
      - gid: "10001"
        mode: "0400"
        source: tf_search_internal_auth_secret
        target: tf_search_internal_auth_secret
        uid: "10001"
      - gid: "10001"
        mode: "0400"
        source: tf_search_heartbeat_secret
        target: tf_search_heartbeat_secret
        uid: "10001"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /tmp/yt-dlp:rw,noexec,nosuid,size=64m
    user: 10001:10001
  tf-web:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 5s
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/healthz
      timeout: 3s
    image: ${TF_WEB_IMAGE:?}
    init: true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      tf-edge: null
    pids_limit: 128
    ports:
      - 127.0.0.1:${TF_CANARY_WEB_PORT:?}:80
    restart: unless-stopped
    stop_grace_period: 20s
