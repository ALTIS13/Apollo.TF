static_resources:
  listeners:
    - name: apollo_account_auth
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      per_connection_buffer_limit_bytes: 32768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: apollo_account_auth
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                use_remote_address: true
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                route_config:
                  name: apollo_account_auth
                  virtual_hosts:
                    - name: apollo_account_auth
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              regex: "https?://(127\\.0\\.0\\.1|localhost)(:[0-9]+)?"
                        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                        allow_headers: "authorization,apikey,content-type,x-client-info,x-request-id"
                        expose_headers: "x-request-id"
                        max_age: "600"
                      routes:
                        - name: account-auth
                          match:
                            prefix: /auth/v1/
                          route:
                            cluster: account-auth
                            prefix_rewrite: /
                            timeout: 30s
                          response_headers_to_add:
                            - header:
                                key: X-Content-Type-Options
                                value: nosniff
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        local PUBLISHABLE_KEY = "__APOLLO_ACCOUNT_PUBLISHABLE_KEY__"

                        local function is_public(path)
                          return path == "/auth/v1/health"
                            or path == "/auth/v1/.well-known/jwks.json"
                            or string.sub(path, 1, 16) == "/auth/v1/verify"
                            or string.sub(path, 1, 18) == "/auth/v1/callback"
                        end

                        function envoy_on_request(request_handle)
                          local headers = request_handle:headers()
                          local method = headers:get(":method")
                          local path = headers:get(":path") or ""
                          local query = string.find(path, "?", 1, true)
                          if query ~= nil then
                            path = string.sub(path, 1, query - 1)
                          end
                          if method == "OPTIONS" or is_public(path) then
                            return
                          end
                          if headers:get("apikey") ~= PUBLISHABLE_KEY then
                            request_handle:respond({
                              [":status"] = "401",
                              ["content-type"] = "application/json",
                              ["cache-control"] = "no-store",
                            }, '{"code":"invalid_api_key"}')
                          end
                        end
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: account-auth
      connect_timeout: 5s
      type: STRICT_DNS
      dns_refresh_rate: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: account-auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: account-auth
                      port_value: 9999
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: /health

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
